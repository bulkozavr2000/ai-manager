# Copy this file to config.toml (git-ignored) and edit it. Every key is optional: whatever
# is left out falls back to the built-in default, which is exactly what is written here.
#
# Secrets (API keys, bot token, phone, address) never go in this file. They live only in
# the OS keyring; set them with:  uv run python -m tg_agent.setup secrets

# Where agent.db, logs/, files/ and evals/ live. A relative path is resolved against the
# folder of this file. Default: <project>/data
# data_dir = "data"

# First day of real conversations; the new-contacts ramp-up is counted from it.
# live_since = 2026-11-10

# The chats of the people the agent writes to make no sound in the work account: a new chat
# is muted for good, an existing one while its task is in work. false: chats are left alone.
mute_chats = true

# The work account's chat folder every person the agent writes to joins; "" = no folder.
chat_folder = "ИИ агент"

[owner]
# Your own name: the agent tells it to people it writes to. The defaults are a made-up owner.
full_name = "Саид Ахмедов"
short_name = "Саид"
# The short name in the genitive case, as in «помощник Саида».
short_name_gen = "Саида"
city = ""
# Telegram user ids the control bot obeys. Empty means nobody can control it: put your own id here.
control_user_ids = []

[limits]
# Spend caps, USD
daily_usd = 5.0
monthly_usd = 40.0
# One task, until you press «Продолжить» on its card (+ this much again)
task_usd = 3.0

# One wake of the task agent: model calls, and money (USD)
wake_max_steps = 12
wake_max_usd = 0.50

# New counterparts per day: ramp_new_contacts_per_day during the first ramp_days days
# from live_since, new_contacts_per_day afterwards
ramp_new_contacts_per_day = 3
ramp_days = 7
new_contacts_per_day = 5

# Waiting and pauses
followup_after_hours = 24
max_followups = 2
owner_pause_hours = 12
batch_window_seconds = 45
batch_max_seconds = 180
send_delay_min_seconds = 60
send_delay_max_seconds = 180

# What the model sees and what is kept
history_messages = 12
raw_retention_days = 90

# People one task may hold, everyone ever attached to it
task_max_people = 12
# People one task may add on a counterpart's recommendation without asking the owner
task_referrals = 3

[schedule]
tz = "Asia/Tashkent"
# The agent sends only from work_start up to work_end. The same time for both ends means
# round the clock: "00:00" and "00:00"
work_start = "09:00"
work_end = "21:00"
# The owner is not disturbed from quiet_start to quiet_end
quiet_start = "21:00"
quiet_end = "06:00"
digest_at = "20:30"
# Round the clock, first messages to new people go only from this time to midnight
new_contacts_start = "09:00"

[models]
decide = "claude-sonnet-5-5"
intake = "claude-sonnet-5-5"
judge = "claude-haiku-5-5"
simulate = "claude-haiku-5-5"
search = "claude-sonnet-5-5"

[search]
# The search for people the task's agent runs when a task has nobody to write to
city = "Ташкент"
max_candidates = 8
max_cost_usd = 0.50
max_steps = 16
# One search ends after running this many minutes (a slow site or OLX)
max_minutes = 8
# Searches one task may run
per_task = 3
web_searches_per_step = 3
web_fetches_per_step = 4
telegram_searches = 4
# OLX and any other site through the agent's own browser on this computer. A site that wants
# a sign-in: you sign in from your phone, see [remote] below
olx = true
browse = true
# Sites to search every time, besides the ones a task names: ["prom.uz", "uzum.uz"]
sites = []
max_pages = 20
# msedge or chrome (installed on this computer), or chromium: Playwright's own, for a server
browser = "msedge"
browser_headless = true
browser_profile = "browser/agent"
# Presses of «Показать телефон» on OLX a day; over it a listing is read without the press
olx_reveals_per_day = 30

[remote]
# Signing in to a site from your phone, in the agent's own browser: when a search meets a
# site that wants a sign-in, the bot sends a card with «Войти» and then a link. It is off
# until a way in from the internet is chosen here:
#   tunnel = "cloudflared"  Cloudflare's quick tunnel; put cloudflared.exe at the path below
#   public_url = "https://…" your own server's address (then tunnel is not needed)
tunnel = "none"
public_url = ""
# The page server on this computer that the way in leads to
port = 8765
# How long one link to the sign-in page works
session_minutes = 10
# Where cloudflared.exe is, relative to the project folder. On a server (compose.yaml) put
# cloudflared for Linux in tools/ by hand and write "tools/cloudflared"
cloudflared = "tools/cloudflared.exe"
