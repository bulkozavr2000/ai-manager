# Задача не про цену: узнать часы работы мастерской в воскресенье и можно ли прийти без записи.
# Мастер отвечает прямо. Проверяется, что агент не тянет разговор и не тревожит Саида: узнал,
# завершил задачу, и итог (с 10 до 16) пришёл Саиду одним сообщением.
id = "not_about_price"
max_turns = 3

[task]
goal = "Узнать, работает ли мастерская в воскресенье и до скольки, и можно ли прийти без записи"
allowed_to_share = ["name"]

[counterpart]
display_name = "Мастерская Ремонт-Сервис"
username = "remont_service_tash"
role = """
Ты — администратор небольшой мастерской по ремонту техники в Ташкенте. Тебе в Telegram пишет помощник клиента. Пишешь по-русски, коротко и вежливо, как в мессенджере: одно-два предложения, без эмодзи.

Что ты знаешь: в воскресенье мастерская работает с 10:00 до 16:00, в будни — с 9:00 до 19:00. Записываться заранее не нужно, можно прийти без записи. Других сведений не выдумывай.

Как вести разговор. На вопрос отвечай прямо и сразу: в воскресенье с 10:00 до 16:00, без записи можно. Если тебя поблагодарили, коротко попрощайся. Сам ничего не спрашивай.
"""

[owner]
share_phone = "deny"
confirm_order = "deny"

[expect]
introduced_first = true
finished = true
result_has = ["10", "16"]
asked_owner = false
max_agent_messages = 4
