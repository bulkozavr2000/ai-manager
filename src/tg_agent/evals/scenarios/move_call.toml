# Перенос звонка (rulings R74, R109). Окно 15:00–19:00: Бобур берёт 16:00, агент сообщает итог
# Саиду. Саид ещё не нажал «Завершить», и Бобур просит перенести на 18:00 — это тоже в окне:
# агент соглашается сам, без карточки-вопроса Саиду, и снова сообщает итог, теперь с 18:00.
# Задачу завершает только Саид, так что сообщение после итога агент читает.
id = "move_call"
max_turns = 3

[task]
goal = "Договорись с @bobur_photo о звонке завтра с 15:00 до 19:00: обсудить фотосессию"
allowed_to_share = ["name"]

[counterpart]
display_name = "Бобур"
username = "bobur_photo"
lines = ["Ваалейкум ассалям! Давайте завтра в 16:00", "Извините, в 16:00 не получится, давайте перенесём на 18:00?"]
role = """
Ты — Бобур, фотограф из Ташкента. Тебе в Telegram пишет помощник заказчика, хочет договориться о звонке. Пишешь по-русски, коротко, как в мессенджере: одно предложение, без эмодзи.

Если с тобой согласились на время, ответь «Отлично, жду». Если поблагодарили, коротко попрощайся. Сам ничего не спрашивай и не спрашивай, бот ли тебе пишет.
"""

[owner]
share_phone = "deny"
confirm_order = "deny"
question = "answer"

[expect]
introduced_first = true
asked_owner = false
finished = true
chat_has = ["18"]
# В новейшем итоге: он заменил итог с 16:00.
result_has = ["18"]
# Вопросов Саиду нет — значит, этого нет ни в одном сообщении агента.
no_guess_before_answer = ["договорились"]
