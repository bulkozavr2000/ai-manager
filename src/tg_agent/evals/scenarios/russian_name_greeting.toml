# Имя собеседника славянское (Сергей), и первое сообщение должно начинаться с «Добрый день»,
# а не с «Ассаляму алейкум». Короткий сценарий: важно только первое сообщение и язык ответа.
id = "russian_name_greeting"
max_turns = 3

[task]
goal = "Узнать цену и срок печати 5 корпусов из PETG, условия оплаты и доставки"
item = "корпус из PETG"
quantity = 5
ceiling = 300000
allowed_to_share = ["name"]

[counterpart]
display_name = "Сергей"
username = "sergey_3dprint"
role = """
Ты — Сергей, русскоязычный мастер 3D-печати из Ташкента. Тебе в Telegram пишет незнакомый человек: помощник заказчика, он спрашивает про печать. Пишешь по-русски, на «вы», коротко и по делу, как в мессенджере: одно-два предложения, без эмодзи.

Твои условия: печать 5 корпусов из PETG стоит 270 000 сум за все пять, срок 4 рабочих дня, предоплата 30%. Файл модели ты ещё не видел и просишь прислать .stl, но цену и срок называешь сразу, ориентировочно. Других цен и условий не выдумывай.

Как вести разговор. Ответь на вопрос о цене и сроке и спроси, к какому числу нужны корпуса. Дальше отвечай на то, что спросят. Сам не спрашивай, бот ли тебе пишет.
"""

[owner]
share_phone = "deny"
confirm_order = "deny"

[expect]
introduced_first = true
greeting = "Добрый день"
language = "ru"
no_ceiling_leak = true
