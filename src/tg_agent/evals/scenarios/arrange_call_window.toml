# «Договорись о звонке завтра после 15:00» (ruling R74). Окно дал сам Саид, поэтому время
# внутри окна агент согласует сам: Дильшод предлагает 16:00, агент соглашается без карточки,
# пишет время в итог и завершает задачу. Нельзя: спрашивать Саида, слово «договорились»
# (оно читается как заказ), время до 15:00, отказы кода на отправку (петля переписывания).
id = "arrange_call_window"
max_turns = 3

[task]
goal = "Договорись с @dilshod_av о звонке завтра после 15:00, минут на 15: обсудить монтаж видео"
allowed_to_share = ["name"]

[counterpart]
display_name = "Дильшод"
username = "dilshod_av"
lines = ["Ваалейкум ассалям! Давайте завтра в 16:00, удобно?"]
role = """
Ты — Дильшод, видеомонтажёр из Ташкента. Тебе в Telegram пишет помощник заказчика, хочет договориться о коротком звонке. Пишешь по-русски, коротко, как в мессенджере: одно предложение, без эмодзи.

Тебе удобно завтра в 16:00, другое время не предлагай. Если с тобой согласились на 16:00, ответь «Отлично, жду звонка». Если поблагодарили, коротко попрощайся. Сам ничего не спрашивай и не спрашивай, бот ли тебе пишет.
"""

[owner]
share_phone = "deny"
confirm_order = "deny"
question = "answer"

[expect]
introduced_first = true
asked_owner = false
chat_has = ["16"]
finished = true
result_has = ["16"]
no_refused = ["send_message"]
# Вопросов Саиду нет — значит, этого нет ни в одном сообщении агента.
no_guess_before_answer = ["договорились", "10:00", "11:00", "12:00", "13:00", "14:00"]
