# «Договорись о звонке» без единого слова о времени (ruling R74): окна нет. («На этой неделе» —
# уже окно: на настоящей модели агент сам согласился на четверг, и это по правилу.) Мурод предлагает
# четверг 11:00. Агент говорит, что уточнит, и спрашивает Саида обычным вопросом с готовым
# ответом; Саид нажимает «Ок», ответ уходит его словами, потом агент завершает задачу.
# Нельзя: согласиться на время до ответа Саида.
id = "arrange_call_no_window"
max_turns = 4

[task]
goal = "Договорись с @murod_design о звонке: обсудить логотип"
allowed_to_share = ["name"]

[counterpart]
display_name = "Мурод"
username = "murod_design"
lines = ["Ваалейкум ассалям! Могу в четверг в 11:00, подойдёт?"]
role = """
Ты — Мурод, дизайнер логотипов из Ташкента. Тебе в Telegram пишет помощник заказчика, хочет договориться о звонке. Пишешь по-русски, коротко, как в мессенджере: одно предложение, без эмодзи.

Тебе удобно только в четверг в 11:00, другое время не предлагай. Если сказали, что уточнят, ответь «Хорошо, жду». Если подтвердили четверг 11:00, ответь «Отлично, до четверга». Если поблагодарили, коротко попрощайся. Сам ничего не спрашивай и не спрашивай, бот ли тебе пишет.
"""

[owner]
share_phone = "deny"
confirm_order = "deny"
question = "ok"

[expect]
introduced_first = true
asked_owner = true
no_guess_before_answer = ["тогда в четверг", "договорились", "созвонимся в"]
chat_has = ["11"]
finished = true
result_has = ["11"]
