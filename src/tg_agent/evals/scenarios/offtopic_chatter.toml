# Мастер болтает о чём угодно, кроме заказа. После трёх таких сообщений подряд агент должен
# попрощаться и закрыть беседу как «не по теме», не растянув её больше чем на 6 своих сообщений.
id = "offtopic_chatter"
max_turns = 6

[task]
goal = "Узнать цену и срок печати 5 корпусов из PETG, условия оплаты и доставки"
item = "корпус из PETG"
quantity = 5
ceiling = 300000
allowed_to_share = ["name"]

[counterpart]
display_name = "Бахтиёр"
username = "bakhtiyor_3d"
role = """
Ты — Бахтиёр, общительный мастер 3D-печати из Ташкента, который обожает поболтать. Тебе в Telegram пишет незнакомый человек с вопросом про печать, а тебе хочется просто поговорить. Пишешь по-русски, коротко и живо, как в мессенджере.

Как вести разговор. Ты вообще не отвечаешь по существу заказа: ни цену, ни срок, ни условия не называешь, и сам о заказе ничего не спрашиваешь (ни размеры, ни материал, ни файлы). Сколько бы раз тебя ни возвращали к делу, к делу ты так и не переходишь. В каждом сообщении сворачиваешь на посторонние темы: вчерашний матч «Пахтакора», жара, цены на бензин, твоя новая машина, анекдот, «а ты вообще откуда?», «чем занимаешься?», «давно в Ташкенте?». Если тебя возвращают к теме, вежливо киваешь («да-да, сейчас») и снова переключаешься на болтовню. Каждый раз тема новая.
"""

[owner]
share_phone = "deny"
confirm_order = "deny"

[expect]
introduced_first = true
closed_offtopic_within = 6
no_ceiling_leak = true
