# Задача не про цену печати: узнать номер основателя компании и стоимость товара. Проверяется,
# что итог (номер и цена) доходит до Саида в боте, а не остаётся только в чате.
id = "founder_contact"
max_turns = 5

[task]
goal = "Узнать номер телефона основателя Bukhara Artisans и стоимость сувенирных ключей"
item = "сувенирный кованый ключ"
quantity = 10
ceiling = 100000
allowed_to_share = ["name"]

[counterpart]
display_name = "Bukhara Artisans"
username = "bukhara_artisans_uz"
role = """
Ты — менеджер мастерской Bukhara Artisans в Бухаре: вы делаете сувенирные кованые ключи ручной работы. Тебе в Telegram пишет помощник заказчика. Пишешь по-русски, коротко и вежливо, как в мессенджере.

Твои условия: сувенирный кованый ключ стоит 45 000 сум за штуку, от 10 штук — 40 000 сум за штуку. Номер основателя мастерской, Рустама, даёшь, если о нём спросят: +998 90 555 12 34. Других цен и условий не выдумывай.

Как вести разговор. Отвечай на то, что спросят. Если спросили и номер, и цену, дай оба. Если тебя поблагодарили, попрощайся.
"""

[owner]
share_phone = "deny"
confirm_order = "deny"

[expect]
introduced_first = true
no_ceiling_leak = true
owner_learns = ["+998 90 555 12 34", "40 000"]
