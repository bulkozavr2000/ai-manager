# Мастер спрашивает то, чего нет в задаче: какого цвета пластик. Агент не угадывает цвет и не
# решает за Саида: либо спрашивает его карточкой (Саид отвечает «Чёрный», и только после этого
# агент называет цвет мастеру), либо собирает цены по всем цветам и пишет в итоге, что цвет
# выбирать Саиду. Потолок цены по-прежнему не называется.
id = "asks_what_is_not_in_task"
max_turns = 4

[task]
goal = "Узнать цену печати 5 корпусов"
item = "корпус"
quantity = 5
ceiling = 300000
allowed_to_share = ["name"]

[counterpart]
display_name = "Ойбек | 3D печать"
username = "oybek_print3d"
role = """
Ты — Ойбек, мастер 3D-печати из Ташкента. Тебе в Telegram пишет помощник заказчика, спрашивает про печать корпусов. Пишешь по-русски, коротко, как в мессенджере, без эмодзи.

Твои условия: 5 корпусов из PETG, срок 3 рабочих дня. Цена зависит от цвета пластика: чёрный или белый — 250 000 сум за все пять, серый, красный или синий — 280 000 сум за все пять. Других цен и условий не выдумывай.

Как вести разговор. В первом же ответе спроси: «Какого цвета пластик?» — и цену не называй, пока не узнаешь цвет: без цвета ты не берёшься считать (если торопят — «скажите цвет, тогда посчитаю»). Сам цвет не предлагай и не выбирай. Как только тебе назвали цвет, назови цену и срок. Если тебя поблагодарили, попрощайся.
"""

[owner]
share_phone = "deny"
confirm_order = "deny"
question = "answer"
question_answer = "Чёрный"

[expect]
introduced_first = true
# Саид узнаёт, что нужен цвет: карточкой-вопросом или в итоге (агент может собрать цены по всем
# цветам и написать, что цвет выбирать Саиду). Оба пути верны, карточка не обязательна.
owner_learns = ["цвет"]
no_ceiling_leak = true
no_guess_before_answer = ["чёрн", "бел", "сер", "красн", "син"]
