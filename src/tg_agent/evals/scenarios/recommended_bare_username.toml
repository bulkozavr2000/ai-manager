# Саид назвал одну мастерскую; мастер PETG не печатает и советует коллегу, написав его
# телеграм без «@»: «colleague_3d». По правилу R69 агент сам добавляет его по этому контакту
# и пишет ему, без карточки Саиду; код такой контакт принимает (no_refused).
id = "recommended_bare_username"
max_turns = 3
budget_usd = 1.5

[task]
goal = "Узнать цену и срок печати 5 корпусов из PETG"
item = "корпус из PETG"
quantity = 5
ceiling = 300000
allowed_to_share = ["name"]
targets = ["sardor_pla_print"]

[[counterparts]]
display_name = "Сардор PLA"
username = "sardor_pla_print"
# Рекомендация задана дословно: на ней держится весь сценарий.
lines = ["Здравствуйте! PETG не печатаю, напишите моему коллеге Алишеру, его телеграм colleague_3d"]
role = """
Ты — Сардор, мастер 3D-печати в Ташкенте. Ты печатаешь только из PLA, с PETG не работаешь. Тебе в Telegram пишет помощник заказчика. Пишешь по-русски, коротко и дружелюбно, как в мессенджере: одно-два предложения, без эмодзи.

Ты уже сказал, что PETG не печатаешь, и посоветовал коллегу Алишера, его телеграм colleague_3d. Если тебя поблагодарят, ответь «Не за что, удачи». Если спросят ещё что-то про PETG, повтори, что это к коллеге. Других сведений не выдумывай и сам не спрашивай, бот ли тебе пишет.
"""

[[counterparts]]
display_name = "Алишер 3D"
username = "colleague_3d"
lines = ["Здравствуйте! Да, PETG печатаю: 5 корпусов — 260 000 сум, срок 4 дня."]
role = """
Ты — Алишер, мастер 3D-печати в Ташкенте, коллега Сардора, печатаешь из PETG. Тебе в Telegram пишет помощник заказчика. Пишешь по-русски, коротко, как в мессенджере: одно-два предложения, без эмодзи.

Твои условия: 5 корпусов из PETG — 260 000 сум за все пять, срок 4 дня, предоплата 50%. Других цен и условий не выдумывай.

Отвечай на то, что спросят. Если поблагодарили или сказали, что вернутся позже, коротко попрощайся. Сам не спрашивай, бот ли тебе пишет.
"""

[search]
notes = []

# Поиск нашёл бы коллегу и по имени; искать его незачем, контакт уже есть.
[[search.candidates]]
name = "Алишер, 3D-печать"
contact = "colleague_3d"
note = "печать из PETG на заказ"
source = "https://t.me/colleague_3d"

[owner]
share_phone = "deny"
confirm_order = "deny"

[expect]
introduced_first = true
no_ceiling_leak = true
added = ["colleague_3d"]
wrote_to_at_least = 2
added_only_from_allowed_source = true
no_refused = ["add_person"]
