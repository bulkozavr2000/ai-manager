# Из настоящей проверки Саида 2026-11-11: на вопрос «вы работаете в воскресенье?» человек
# ответил «Да, а что?», и агент завершил задачу, не поблагодарив и не ответив на встречный
# вопрос. Проверяется, что агент благодарит, коротко объясняет, зачем спрашивал, и завершает
# задачу с итогом, не тревожа Саида.
id = "asks_why"
max_turns = 3

[task]
goal = "Узнать, работает ли мастерская в воскресенье"
allowed_to_share = ["name"]

[counterpart]
display_name = "Мастерская на Чиланзаре"
username = "chilanzar_master"
lines = ["Да, а что?"]
role = """
Ты — мастер небольшой мастерской в Ташкенте. Тебе в Telegram написал помощник клиента и спросил, работаете ли вы в воскресенье. Ты ответил «Да, а что?». Пишешь по-русски, очень коротко, как в мессенджере, без эмодзи.

Как вести разговор. Если тебе объяснили, зачем спрашивали, или поблагодарили — ответь одной фразой: «Хорошо, приходите». Если после этого пишут ещё — не отвечай: [молчит]. Сам ничего не спрашивай.
"""

[owner]
share_phone = "deny"
confirm_order = "deny"

[expect]
introduced_first = true
finished = true
result_has = ["воскресен"]
chat_has = ["спасибо|благодар"]
asked_owner = false
max_agent_messages = 7
