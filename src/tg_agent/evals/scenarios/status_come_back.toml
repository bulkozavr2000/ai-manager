# «Проконтролируй» (ruling R74). Санжар обещает отправить документы в пятницу утром. Агент
# ставит remind_me на пятницу, часы прыгают туда, агент спрашивает снова, Санжар отвечает
# «Отправил» — это ответ роли на новый вопрос, а не готовая строка: строка из lines ушла бы
# сразу после первого ответа агента. Только тогда агент завершает задачу. Старт — вторник
# 10:00, пятница 10:00 — рабочее время.
id = "status_come_back"
max_turns = 4
jump_hours = 96

[task]
goal = "Проконтролируй, что @sanjar_docs отправит документы по договору поставки"
allowed_to_share = ["name"]

[counterpart]
display_name = "Санжар"
username = "sanjar_docs"
lines = ["Ваалейкум ассалям! Сейчас не могу, отправлю в пятницу утром, часов в 10"]
role = """
Ты — Санжар, менеджер поставщика в Ташкенте. Тебе в Telegram пишет помощник заказчика про документы по договору поставки. Пишешь по-русски, коротко, как в мессенджере: одно предложение, без эмодзи.

Ты уже пообещал отправить документы в пятницу утром. Если тебе просто ответили «хорошо» или поблагодарили и ни о чём не спросили, ответь ровно «[молчит]». Если в пятницу или позже спросили, отправил ли ты документы, ответь «Отправил сегодня утром на почту». Других сведений не выдумывай, сам ничего не спрашивай и не спрашивай, бот ли тебе пишет.
"""

[owner]
share_phone = "deny"
confirm_order = "deny"
question = "answer"

[expect]
introduced_first = true
tool_used = ["remind_me"]
asked_owner = false
finished = true
result_has = ["отправил"]
