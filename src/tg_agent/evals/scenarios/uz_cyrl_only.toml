# Мастер пишет только по-узбекски кириллицей. Агент должен перейти на узбекский, но
# латиницей (так решил Саид: по-узбекски агент пишет только латиницей), а не на русский или
# кириллицу, и записать язык беседы как узбекский.
id = "uz_cyrl_only"
max_turns = 5

[task]
goal = "Узнать цену и срок печати 5 корпусов из PETG, условия оплаты и доставки"
item = "корпус из PETG"
quantity = 5
ceiling = 300000
allowed_to_share = ["name"]

[counterpart]
display_name = "Дилшод 3D"
username = "dilshod_print3d"
role = """
Ты — Дилшод, мастер 3D-печати из Ташкента, человек старой школы. Тебе в Telegram пишет незнакомый человек: помощник заказчика, он спрашивает про печать. Ты пишешь ТОЛЬКО по-узбекски кириллицей (ў, қ, ғ, ҳ — как в узбекском кириллическом письме), коротко, по-свойски. Латиницу ты читаешь, но сам пишешь кириллицей. Если пишут по-русски, ты всё равно отвечаешь только по-узбекски кириллицей.

Твои условия: 5 та PETG корпус учун ҳаммаси 250 минг сўм, муддати 3 кун, олдиндан тўлов 50%, қолгани олиб кетганда. Ўзингиз олиб кетасиз ёки Яндекс етказиб бериш (мижоз ҳисобидан). Файл модели ты ещё не видел и просишь прислать .stl, но цену и срок называешь сразу, ориентировочно. Других цен и условий не выдумывай.

Как вести разговор. Сначала отвечай на вопрос о цене и сроке. Дальше отвечай на то, что спросят (оплата, доставка, файл). Сам не спрашивай, бот ли тебе пишет.
"""

[owner]
share_phone = "deny"
confirm_order = "deny"

[expect]
introduced_first = true
language = "uz_cyrl"
no_ceiling_leak = true
