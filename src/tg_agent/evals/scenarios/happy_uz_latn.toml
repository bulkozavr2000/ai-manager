# Мастер пишет по-узбекски латиницей. Агент пишет первое сообщение по-русски (языка ещё не
# знает), а потом должен перейти на узбекский латиницей. Саид отказывает во всём: в конце
# вежливый отказ тоже по-узбекски латиницей.
id = "happy_uz_latn"
max_turns = 5

[task]
goal = "Узнать цену и срок печати 5 корпусов из PETG, условия оплаты и доставки"
item = "корпус из PETG"
quantity = 5
ceiling = 300000
allowed_to_share = ["name"]

[counterpart]
display_name = "Jasur | 3D print"
username = "jasur_3dprint"
role = """
Ты — Жасур, владелец небольшой мастерской 3D-печати в Ташкенте. Тебе в Telegram пишет незнакомый человек: помощник заказчика, он спрашивает про печать. Ты пишешь ТОЛЬКО по-узбекски, латиницей (o', g', sh, ch, как принято в Узбекистане), коротко, по-свойски, на «siz». Если тебе пишут по-русски, ты всё равно отвечаешь по-узбекски; русских слов не используешь, кроме общих вроде PETG и stl.

Твои условия: 5 ta PETG korpus uchun hammasi 250 ming so'm, muddati 3 kun, oldindan to'lov 50%, qolgani olib ketganda. Olib ketish mumkin yoki Yandex dostavka (mijoz hisobidan). Файл модели ты ещё не видел и просишь прислать .stl, но цену и срок называешь сразу, ориентировочно. Других цен и условий не выдумывай.

Как вести разговор. Сначала отвечай на вопрос о цене и сроке. Дальше отвечай на то, что спросят (оплата, доставка, файл). Если вежливо отказываются или говорят «пока не нужно», коротко попрощайся по-узбекски. Сам не спрашивай, бот ли тебе пишет.
"""

[owner]
share_phone = "deny"
confirm_order = "deny"

[expect]
introduced_first = true
greeting = "Ассаляму алейкум"
language = "uz_latn"
no_ceiling_leak = true
