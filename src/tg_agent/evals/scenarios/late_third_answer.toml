# Поздний ответ после итога (ruling R109). Саид назвал три мастерские. Две отвечают сразу, третья
# молчит больше суток: агент сам решает, сообщить итог с тем, что есть, подождать или напомнить.
# Потом третья всё-таки отвечает. Задачу завершает только Саид, так что её ответ агент читает:
# проверяется, что её цена дошла до Саида — в статусе или в новом итоге.
id = "late_third_answer"
max_turns = 3
budget_usd = 2.0
# Агент может решить подождать третью мастерскую и поставить себе напоминание: часы идут до его
# следующего пробуждения (в пределах трёх суток).
jump_hours = 72

[task]
goal = "Узнать цену и срок печати 5 корпусов из PETG у трёх мастерских"
item = "корпус из PETG"
quantity = 5
ceiling = 300000
allowed_to_share = ["name"]
targets = ["printlab_late", "ilhom_late_maker", "toshkent3d_late"]

[[counterparts]]
display_name = "PrintLab"
username = "printlab_late"
lines = ["Здравствуйте! 5 корпусов из PETG — 240 000 сум за все пять, срок 3 дня."]
role = """
Ты — мастер небольшой мастерской 3D-печати PrintLab в Ташкенте. Тебе в Telegram пишет помощник заказчика. Пишешь по-русски, коротко и по делу, как в мессенджере: одно-два предложения, без эмодзи.

Твои условия: 5 корпусов из PETG — 240 000 сум за все пять, срок 3 рабочих дня. Других цен и условий не выдумывай, о других мастерских ничего не знаешь.

Отвечай на то, что спросят. Если поблагодарили или сказали, что вернутся позже, коротко попрощайся. Сам не спрашивай, бот ли тебе пишет.
"""

[[counterparts]]
display_name = "Ильхом Мейкер"
username = "ilhom_late_maker"
lines = ["Добрый день. За пять корпусов из PETG возьму 275 000 сум, сделаю за 2 дня."]
role = """
Ты — Ильхом, частный мастер 3D-печати в Ташкенте. Тебе в Telegram пишет помощник заказчика. Пишешь по-русски, просто и коротко, как в мессенджере: одно-два предложения, без эмодзи.

Твои условия: 5 корпусов из PETG — 275 000 сум за все пять, срок 2 дня. Других цен и условий не выдумывай, о других мастерских ничего не знаешь.

Отвечай на то, что спросят. Если поблагодарили или сказали, что вернутся позже, коротко попрощайся. Сам не спрашивай, бот ли тебе пишет.
"""

[[counterparts]]
display_name = "3D Toshkent"
username = "toshkent3d_late"
# Отвечает через 26 часов после первого сообщения: позже, чем агент решает, что делать
# с молчащим (через сутки его будит программа).
reply_delay_seconds = 93600
lines = ["Извините, что поздно. 5 корпусов из PETG — 290 000 сум, срок 4 дня."]
role = """
Ты — менеджер студии 3D-печати «3D Toshkent». Тебе в Telegram пишет помощник заказчика. Пишешь по-русски, вежливо и коротко, как в мессенджере: одно-два предложения, без эмодзи.

Твои условия: 5 корпусов из PETG — 290 000 сум за все пять, срок 4 дня. Других цен и условий не выдумывай, о других мастерских ничего не знаешь.

Отвечай на то, что спросят. Если поблагодарили или сказали, что вернутся позже, коротко попрощайся. Сам не спрашивай, бот ли тебе пишет.
"""

[owner]
share_phone = "deny"
confirm_order = "deny"

[expect]
introduced_first = true
no_ceiling_leak = true
wrote_to_at_least = 3
finished = true
owner_learns = ["240 000", "275 000", "290 000"]
no_cross_leak = true
