name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
      # the browser tests use Playwright's own Chromium (there is no Edge on the runner)
      TG_AGENT_TEST_BROWSER: chromium
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.16"
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Install Chromium for the browser tests
        run: uv run playwright install --with-deps chromium

      - name: Run the test suite (live tests skip themselves without TG_AGENT_LIVE=1)
        run: uv run pytest -q -p no:cacheprovider
